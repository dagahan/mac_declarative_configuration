# Every piece of software on this machine.
#
#   [brew]           Homebrew formulae — command-line tools
#   [cask]           Homebrew casks — apps with a bundle
#   [download.NAME]  no cask exists upstream; pin the url, version and checksum
#   [manual.NAME]    nothing may install this for you — say what to do instead
#
# This is the only file to edit and the only thing that is the lock. The
# Brewfile and the cask files `mac sync` hands to Homebrew are generated into
# ~/.local/state/mac_setup and deliberately not kept in the repo: they say
# nothing this file does not already say.

[tap]
FelixKratz/formulae

[brew]
# shell and cli
git
bash
ripgrep
fd
neovim
uv
ffmpeg
xcodegen

# languages
rustup
go
openjdk@17
# 21, not 17: super-productivity's android build compiles at JavaVersion.VERSION_21
openjdk@21
# keg-only on purpose: node 26 arrives as a dependency of bitwarden-cli and
# kimi-code, so nothing shadows it. Prepend the opt/bin to PATH where 22 is
# wanted — super-productivity pins it in .nvmrc.
node@22

# focused-window outline daemon (config/borders/bordersrc)
borders

# secrets — units/secrets.zsh reads both
bitwarden-cli
age

# tunnel — private/vpn
sing-box

# ai
kimi-code

[cask]
# terminal
kitty
font-jetbrains-mono-nerd-font

# the desktop — aerospace, alttab and ainto are built from vendor/ forks
karabiner-elements
linearmouse
hammerspoon

# editors and office
visual-studio-code
obsidian
microsoft-word
microsoft-excel
microsoft-powerpoint

# media
spotify
ayugram
easydict

# ai
claude
claude-code
chatgpt
lm-studio

# secrets
bitwarden

# network
amneziavpn
logmein-hamachi

# the rest
google-drive
# adb; the sdk itself comes from android-studio's first-run wizard
android-platform-tools
android-studio

[download.hiddify]
url = "https://github.com/hiddify/hiddify-app/releases/download/v4.1.1/Hiddify-MacOS.dmg"
sha256 = "2019c85aef259002909a088be7bfb28032bf9ce7f932ffa597fdfe3b4cbff914"
desc = "Proxy client used by the private vpn tree"

[manual.xcode]
do = "Install Xcode from the App Store, then run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && sudo xcodebuild -license accept"
detect = "xcodebuild -version"
