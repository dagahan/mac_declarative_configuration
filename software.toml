# Every piece of software on this machine.
#
#   [brew]           Homebrew formulae — command-line tools
#   [cask]           Homebrew casks — apps with a bundle
#   [download.NAME]  no cask exists upstream — give the link, nothing else
#   [manual.NAME]    nothing may install this for you — say what to do instead
#
# A download needs only its url. On the first sync the file is fetched once and
# read: what it installs, what version it calls itself and what it hashes to are
# all facts about the file, so they are taken from it and remembered rather than
# typed in here. State any of them yourself and yours wins.
#
# This is the only file to edit. The Brewfile and the cask files `mac sync`
# hands to Homebrew are generated into ~/.local/state/mac_setup and deliberately
# not kept in the repo: they say nothing this file does not already say.

[tap]
FelixKratz/formulae

[brew]
# shell and cli
git
bash
ripgrep
fd
neovim
uv
ffmpeg
xcodegen

# languages
rustup
go
openjdk@17

# focused-window outline daemon (config/borders/bordersrc)
borders

# secrets — units/secrets.zsh reads both
bitwarden-cli
age

# tunnel — private/vpn
sing-box

# ai
kimi-code

[cask]
# terminal
kitty
font-jetbrains-mono-nerd-font

# the desktop — aerospace, alttab and ainto are built from vendor/ forks
karabiner-elements
linearmouse
hammerspoon

# editors and office
visual-studio-code
obsidian
microsoft-word
microsoft-excel
microsoft-powerpoint

# media
spotify
ayugram
easydict

# ai
claude
claude-code
chatgpt
lm-studio

# secrets
bitwarden

# network
amneziavpn
logmein-hamachi

# the rest
google-drive
android-platform-tools

[download.hiddify]
url = "https://github.com/hiddify/hiddify-app/releases/download/v4.1.1/Hiddify-MacOS.dmg"
desc = "Proxy client used by the private vpn tree"
homepage = "https://hiddify.com/"

[manual.xcode]
do = "Install Xcode from the App Store, then run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer && sudo xcodebuild -license accept"
detect = "xcodebuild -version"

